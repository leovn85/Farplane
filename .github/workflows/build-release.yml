name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore Dependencies
      run: nuget restore Farplane.csproj

    - name: Build Farplane (Release x86)
      run: |
        msbuild Farplane.csproj /p:Configuration=Release /p:Platform=x86 /p:OutputPath=bin\Release\

    - name: Package Release Zip
      shell: pwsh
      run: |
        $zipName = "Farplane-${{ github.ref_name }}.zip"
        Compress-Archive -Path "bin\Release\*" -DestinationPath $zipName
        Write-Host "Created archive: $zipName"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: Farplane-*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}